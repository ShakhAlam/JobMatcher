[project]
name = "job-matcher-backend"
version = "0.1.0"
description = "FastAPI + LangGraph service that scores a resume against a job description"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
